name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kir-dev.hu
          tags: |
            # Tag the Docker image using a version created from the GitHub action run number.
            # Using the Git hash as the tag does not work because Renovate does not know how to find the latest version.
            # Using just :latest with a @sha256:IMAGE_HASH does not work as digest updates do not add a GitHub diff link to the Renovate PR.
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Renovate needs a Git tag to show a GitHub diff link
      - name: Create Git tag
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

  update-k8s:
    name: Update kir-dev/k8s
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout k8s
        uses: actions/checkout@v6
        with:
          repository: kir-dev/k8s
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      # bunx runs Renovate with Node; renovate@44 requires Node ^24.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun run renovate kir-dev.hu
        env:
          RENOVATE_TOKEN: ${{ secrets.KIR_DEV_BOT_PAT }}
